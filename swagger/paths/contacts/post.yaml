#/swagger/paths/Contacts/post.yaml

tags:
  - Contacts
summary: Create Contact
operationId: createContact
description: 'Create a Contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Yulia Shevchenko'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380000000001'
          email:
            description: "Contact's email"
            type: string
            example: 'oleh1@example.com'
          isFavourite:
            description: "Contact's is Favourite"
            type: boolean
            example: false
          contactType:
            description: "Contact's contact Type"
            type: string
            enum: ['work', 'home', 'personal']
          userId:
            description: "Contact's parent id"
            type: string
            example: 65e4decdd286b30065d54af9
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Creates a Contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a Contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
